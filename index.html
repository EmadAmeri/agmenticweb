<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090a08" />
    <meta name="description" content="Agmentic — imagine, experiment and build what comes next with AI." />
    <title>Agmentic — Imagine what becomes possible</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wdth,wght@75..100,400..700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=20260810-responsive" />
    <script src="script.js?v=20260810-responsive" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#invitation">Skip to invitation</a>

    <div class="atmosphere" aria-hidden="true">
      <div class="beam-array">
        <div class="signal signal-haze"></div>
        <div class="signal signal-body"></div>
        <div class="signal signal-core"></div>
      </div>
      <div class="signal-orbit"></div>
      <div class="signal-lock"><span></span></div>
    </div>

    <header class="masthead">
      <a class="brand" href="/" aria-label="Agmentic home">
        <img src="assets/agmentic-logo.png" alt="" width="40" height="40" />
        <span>AGMENTIC</span>
      </a>
    </header>

    <main class="hero">
      <h1 aria-label="Imagine what becomes possible">
        <span class="line line-one">IMAGINE</span>
        <span class="line line-two">WHAT BECOMES</span>
        <span class="line line-three">POSSIBLE.</span>
      </h1>

      <section class="invitation" id="invitation" aria-labelledby="invite-title">
        <div class="invite-heading">
          <p class="event-label"><i aria-hidden="true"></i>NEXT AGMENTIC EVENT</p>
        </div>
        <h2 id="invite-title">Get invited to<br />what’s next.</h2>

        <form class="invite-form" data-invite-form data-endpoint="https://agmentic-homepage-leads.em-ameri94.workers.dev" novalidate>
          <div class="field">
            <label class="visually-hidden" for="email">Email address</label>
            <input id="email" name="email" type="email" inputmode="email" autocomplete="email" spellcheck="false" placeholder="Enter your email" required aria-describedby="form-status" />
          </div>
          <input class="honeypot" name="website" type="text" tabindex="-1" autocomplete="off" aria-hidden="true" />
          <button type="submit" aria-label="Submit email for invitation">
            <span class="button-label visually-hidden">Submit email for invitation</span>
            <svg class="submit-mark" viewBox="0 0 52 32" aria-hidden="true">
              <g class="dot-trail">
                <circle cx="6" cy="16" r="1.6" /><circle cx="14" cy="16" r="1.6" /><circle cx="22" cy="16" r="1.6" /><circle cx="30" cy="16" r="1.6" />
              </g>
              <g class="dot-head">
                <circle cx="26" cy="6" r="1.6" /><circle cx="34" cy="11" r="1.6" /><circle cx="42" cy="16" r="2" /><circle cx="34" cy="21" r="1.6" /><circle cx="26" cy="26" r="1.6" />
              </g>
            </svg>
          </button>
          <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <nav class="contact-links" aria-label="Contact Agmentic">
      <a href="mailto:hello@agmentic.com" aria-label="Email Agmentic" title="Email Agmentic">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="2.75" y="4.75" width="18.5" height="14.5" rx="1.5" />
          <path d="m4 6 8 6 8-6" />
        </svg>
      </a>
      <a href="https://www.linkedin.com/company/agmentic/" target="_blank" rel="noreferrer" aria-label="Agmentic on LinkedIn" title="Agmentic on LinkedIn">
        <svg class="linkedin-mark" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7.2 10.1v7M7.2 7.1v.1M11.2 17v-6.9M11.2 13.1c.35-1.8 1.5-3 3.25-3 1.95 0 2.75 1.3 2.75 3.35V17" />
        </svg>
      </a>
    </nav>

    <footer class="site-footnote" aria-label="Site information">
      <span>© 2026 AGMENTIC</span><i aria-hidden="true"></i><span>MUNICH</span>
    </footer>

  </body>
</html>
