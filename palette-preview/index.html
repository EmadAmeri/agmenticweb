<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090a08" />
    <title>Agmentic — Palette Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <header class="lab-header">
      <div class="lab-title">
        <span>AGMENTIC</span>

      <div class="palette-route" aria-label="Colour family route"></div>

      <div class="palette-note" aria-live="polite">
        <strong data-palette-name>Electric Cobalt</strong>
        <span data-palette-meaning>Intellectual · authoritative · future-facing</span>
        <code data-palette-hex>#5B63FF</code>
      </div>

    <main class="preview-shell">
      <div class="preview-loading" aria-hidden="true">Resolving palette</div>
      <iframe title="Agmentic website palette preview" src="../index.html?palette-preview=electric-cobalt"></iframe>
    </main>

    <p class="local-only">PRIVATE TEAM REVIEW · TEMPORARY</p>
